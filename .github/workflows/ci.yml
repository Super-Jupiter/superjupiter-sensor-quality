name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Strict C++11 tests with sanitisers
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          mkdir -p build
          "$CXX" -std=c++11 -Wall -Wextra -Wconversion -pedantic -Werror \
            -fsanitize=address,undefined -fno-omit-frame-pointer -Isrc \
            tests/test_sensor_quality.cpp -o build/test-quality
          ./build/test-quality
          "$CXX" -std=c++11 -Wall -Wextra -Werror -Isrc tools/replay.cpp -o build/replay
          ./build/replay
      - name: CMake integration
        env:
          CXX: ${{ matrix.compiler }}
        run: |
          cmake -S . -B build/cmake
          cmake --build build/cmake
          ctest --test-dir build/cmake --output-on-failure

  arduino-builds:
    name: Compile ${{ matrix.fqbn }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - core: esp32:esp32@3.3.12
            fqbn: esp32:esp32:esp32
          - core: esp32:esp32@3.3.12
            fqbn: esp32:esp32:esp32s3
          - core: esp32:esp32@3.3.12
            fqbn: esp32:esp32:esp32c3
          - core: arduino:avr@1.8.8
            fqbn: arduino:avr:uno
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: arduino/setup-arduino-cli@81d310742121c928ea9c8bbd407b4217b432ae02 # v2.0.0
        with:
          version: 1.5.1
      - name: Install board core
        env:
          CORE: ${{ matrix.core }}
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install "$CORE" --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
      - name: Compile examples
        env:
          FQBN: ${{ matrix.fqbn }}
        run: |
          arduino-cli compile --fqbn "$FQBN" --library . examples/MinimalUsage
          arduino-cli compile --fqbn "$FQBN" --library . examples/SyntheticTemperature
